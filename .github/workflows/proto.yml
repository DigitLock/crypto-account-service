name: proto

on:
  push:
    branches:
      - "feature/**"
      - main
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "internal/grpc/pb/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/proto.yml"
  pull_request:
    branches:
      - main
    paths:
      - "proto/**"
      - "buf.yaml"
      - "buf.gen.yaml"
      - "internal/grpc/pb/**"
      - "api/**"
      - "Makefile"
      - ".github/workflows/proto.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install buf
        run: |
          mkdir -p "$RUNNER_TEMP/buf"
          curl -sSfL -o "$RUNNER_TEMP/buf/buf" \
            https://github.com/bufbuild/buf/releases/download/v1.73.0/buf-Linux-x86_64
          echo "8f2986298ad08f0cc1bf999b9797b7c383adf32d7edf0f73d6f1e1a701baeac1  $RUNNER_TEMP/buf/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf/buf"
          echo "$RUNNER_TEMP/buf" >> "$GITHUB_PATH"

      - name: Install plugins
        run: make tools

      - name: Contract check
        run: make proto-check

      - name: OpenAPI contract check
        run: make openapi-check
