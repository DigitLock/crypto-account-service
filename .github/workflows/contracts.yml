name: contracts

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches:
      - main
    paths:
      - "contracts/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3

      - name: Forge version
        run: forge --version

      - name: Format check
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci

      - name: ABI frozen
        run: |
          forge inspect CardSpendController abi --json | diff - abi/CardSpendController.json
          forge inspect MockUSDC abi --json | diff - abi/MockUSDC.json
