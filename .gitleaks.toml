title = "Crypto Account Service"

[extend]
useDefault = true

# The example auth_id of SRS - Card Spend, reused by the OpenAPI examples and two tests. A UUID, not a secret.
# Allowed only as that exact value and only in these files.
[[allowlists]]
description = "Example auth_id of SRS - Card Spend, the OpenAPI examples and two tests. A UUID, not a secret"
condition = "AND"
regexTarget = "secret"
regexes = ['''^9f1c2a7e-5b1d-4c58-9a57-0d2f6f1e8a11$''']
paths = [
  '''^docs/srs/card-spend\.md$''',
  '''^api/openapi/(frozen/)?card-auth\.yaml$''',
  '''^internal/decision/ids_test\.go$''',
  '''^internal/grpc/api/cards_test\.go$''',
]

# The HMAC example secret of the Binance Spot API documentation, the test vector of X1-T103. A public example of the
# documentation, not a key of any account. Allowed only as that exact value and only in that test file.
[[allowlists]]
description = "HMAC example secret of the Binance Spot API documentation, test vector of X1-T103. Public, not a key of any account"
condition = "AND"
regexTarget = "secret"
regexes = ['''^NhqPtmdSJYdKjVHjA7PZj4Mge3R5YNiP1e3UZjInClVN65XAbvqqM6A7H5fATj0j$''']
paths = [
  '''^internal/connector/binance/binance_test\.go$''',
]
